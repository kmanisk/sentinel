services:
  - type: web
    name: sentinel
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildCommand: cd client && npm ci && npm run build && cd ../server && npm ci && npx prisma generate && npm run build
    startCommand: cd server && npx prisma db push && npx tsx prisma/seed.ts && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
